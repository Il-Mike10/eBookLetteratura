<script>
(function () {
  "use strict";
  const root = document.getElementById("leopardi-site");
  if (!root) return;
  const content = root.querySelector("#ls-content");
  const nav = root.querySelector(".ls-links");
  const timeline = [
    ["1798–1809","Infanzia a Recanati","Giacomo Leopardi nasce a Recanati il 29 giugno 1798, in una famiglia aristocratica.",["È il primogenito di Monaldo Leopardi e Adelaide Antici. Cresce nella casa di famiglia, in un ambiente colto ma severo.","La biblioteca paterna diventa il centro della sua formazione: fin da bambino si dedica alla lettura e allo studio."],"In quale città nacque Giacomo Leopardi?",["Pisa","Recanati","Napoli"],1,"Leopardi nacque a Recanati il 29 giugno 1798."],
    ["1809–1816","Gli anni dello studio","Nella biblioteca di casa costruisce una cultura vastissima e si avvicina alla poesia.",["Studia da autodidatta lingue classiche, storia, filosofia e letteratura, traducendo anche autori antichi.","Questi anni di studio intenso gli danno una preparazione eccezionale, ma mettono a dura prova la sua salute.","Con il tempo passa dall'erudizione alla scrittura poetica e alla riflessione personale."],"Dove si forma soprattutto il giovane Leopardi?",["Nella biblioteca di famiglia","All'università di Bologna","A corte a Firenze"],0,"La biblioteca di famiglia a Recanati fu il centro della sua formazione."],
    ["1817–1822","Dallo studio alla poesia","Leopardi avvia lo Zibaldone e compone alcuni dei suoi primi grandi idilli.",["Nel 1817 inizia lo Zibaldone, un diario di pensieri e osservazioni che continuerà per molti anni.","Nel 1819 compone L'infinito. Nello stesso periodo tenta di lasciare Recanati, ma il progetto fallisce.","Nel 1822 visita Roma: il viaggio amplia la sua esperienza, ma non corrisponde alle aspettative."],"Quale opera raccoglie pensieri e appunti di Leopardi?",["I Promessi sposi","Lo Zibaldone","Il Decameron"],1,"Lo Zibaldone è il suo ampio diario intellettuale."],
    ["1823–1827","Le Operette morali","Dopo il ritorno a Recanati, Leopardi approfondisce la riflessione sulla condizione umana.",["Nel 1824 scrive gran parte delle Operette morali, dialoghi e prose filosofiche sulla felicità e sul dolore.","Nel 1825 lascia Recanati per lavorare a Milano, Bologna e Firenze, ma la precarietà economica lo accompagna.","Nel 1827 esce a Milano la prima edizione delle Operette morali."],"Quale forma caratterizza molte Operette morali?",["Dialoghi e prose filosofiche","Poemi epici in ottave","Commedie teatrali"],0,"Le Operette morali sono prose filosofiche, spesso in forma di dialogo."],
    ["1828–1837","Gli ultimi anni e la Ginestra","Tra Pisa, Firenze e Napoli scrive nuovi canti e riflette sulla solidarietà umana.",["Nel 1828 compone A Silvia. Nel 1829, a Recanati, scrive altri canti importanti.","Dal 1830 vive soprattutto tra Firenze e Napoli; Antonio Ranieri gli resterà vicino.","Nel 1836 compone La ginestra, che invita gli uomini a unirsi di fronte alla fragilità comune.","Muore a Napoli il 14 giugno 1837."],"Dove muore Giacomo Leopardi?",["A Recanati","A Roma","A Napoli"],2,"Leopardi muore a Napoli il 14 giugno 1837."]
  ];
  const dialogue = [
    ["Un Islandese, che era corso per la maggior parte del mondo [...] andando una volta per l’interiore dell’Affrica, e passando sotto la linea equinoziale [...] vide da lontano un busto grandissimo [...] una forma smisurata di donna seduta in terra, appoggiata a una montagna; viva, di volto mezzo tra bello e terribile.","Un islandese attraversa l'Africa centrale, vicino all'Equatore, in un luogo dove nessun uomo era mai arrivato. Da lontano scorge una figura gigantesca; avvicinandosi scopre una donna viva, seduta accanto a una montagna, con un volto insieme bello e spaventoso."],

    ["🎨 Arte & Cinema",[
      ["Friedrich · Il viandante sul mare di nebbia (1818)","Un uomo di spalle osserva un paesaggio montuoso coperto dalla nebbia. La figura è al tempo stesso protagonista dello sguardo e presenza piccola davanti a uno spazio che non riesce a dominare: è il sublime romantico, fatto di attrazione e smarrimento. Il confronto con L'infinito nasce dal limite della vista, ma in Leopardi l'oltre è affidato all'immaginazione e non a una certezza trascendente."],
      ["Friedrich · Il mare di ghiaccio (1823–24)","Lastre di ghiaccio si accumulano fino a sommergere una nave, lasciando l'essere umano quasi invisibile nel paesaggio. La natura appare grandiosa e indifferente alla sorte dei singoli: per questo il dipinto può essere accostato al Dialogo della Natura e di un Islandese. In entrambi i casi la fragilità umana emerge davanti a forze che non agiscono per punire o premiare l'uomo."],
      ["Cinema · Interstellar e Dune","In Interstellar e Dune gli ambienti estremi, la scarsità di risorse e la vastità dei paesaggi condizionano le scelte dei personaggi. Questi mondi possono ricordare la Natura del Dialogo, davanti alla quale l'essere umano è piccolo e vulnerabile. Il paragone non significa che i film riprendano direttamente Leopardi: permette piuttosto di confrontare come poesia e cinema rappresentano il rapporto tra esseri umani, ambiente e sopravvivenza."]

    ["🌋 Scienze della Terra e Geografia",[
      ["Islanda: un'isola che si apre","L'Islanda si trova sulla dorsale medio-atlantica, una zona in cui le placche nordamericana ed euroasiatica si allontanano. La risalita del magma contribuisce alla sua intensa attività vulcanica e geotermica, mentre ghiacciai e coste modellano un paesaggio di forti contrasti. Nel Dialogo l'Islandese racconta proprio un viaggio attraverso ambienti diversi: conoscere la geografia dell'isola aiuta a immaginare il mondo da cui proviene, senza confondere il personaggio letterario con un resoconto scientifico."],
      ["L'Hekla e l'Eyjafjallajökull","Il monte «Ecla» nominato dall'Islandese è generalmente identificato con l'Hekla, uno dei vulcani più noti d'Islanda. L'Eyjafjallajökull è invece un vulcano coperto da un ghiacciaio, diventato celebre per l'eruzione del 2010 e la nube di cenere che interferì con il traffico aereo europeo. Il confronto mostra come vulcani e ghiaccio possano convivere nello stesso territorio e trasformarne paesaggi, attività e collegamenti."],
      ["Sahara: giorni infuocati, notti gelide","Nel Sahara il forte irraggiamento riscalda rapidamente il suolo durante il giorno, mentre la scarsa umidità e la perdita di calore possono rendere le notti molto più fredde. Le condizioni cambiano secondo la stagione e la zona, ma l'escursione termica è una caratteristica importante degli ambienti desertici. Nel racconto dell'Islandese il passaggio da un estremo climatico all'altro rende concreto il suo tentativo di trovare un luogo in cui vivere senza sofferenza."]

    ["🧠 Filosofia & Psicologia",[
      ["Leopardi e Schopenhauer","Schopenhauer individua nella Volontà una forza cieca che sta alla radice del desiderio e della sofferenza; Leopardi rappresenta invece una Natura che produce e distrugge senza un progetto rivolto alla felicità umana. Le due visioni possono essere messe a confronto, ma non vanno identificate né presentate come prova di un'influenza diretta. Nella riflessione leopardiana, alla lucidità sulla condizione umana si affiancano la poesia e, nella Ginestra, la possibilità di una solidarietà tra gli uomini."],
      ["Eco-ansia: l'Islandese di oggi","Nel Dialogo l'Islandese lascia i luoghi che ritiene ostili e cerca di sottrarsi a caldo, freddo e pericoli: il suo viaggio può offrire uno spunto per parlare delle preoccupazioni contemporanee legate ai cambiamenti ambientali. L'accostamento all'eco-ansia è una lettura attuale, non una diagnosi del personaggio. Aiuta a distinguere il timore individuale dalle domande collettive su prevenzione, informazione e responsabilità verso l'ambiente."],
      ["Una differenza importante","La Natura leopardiana è indifferente, non «cattiva»: non sceglie di colpire l'uomo e non persegue uno scopo morale. Le crisi ambientali di oggi hanno anche cause legate alle attività umane, alle scelte produttive e ai modelli di consumo. Per questo non basta sovrapporre il pensiero di Leopardi ai problemi attuali: il confronto serve a interrogarsi sulla fragilità umana, mentre la conoscenza scientifica permette di individuare cause e responsabilità specifiche."]

    ["🏛️ Educazione Civica",[
      ["Salute mentale, inclusione e condizione giovanile (Art. 32)","L'isolamento vissuto da Leopardi a Recanati, il rapporto con i genitori, le difficoltà fisiche e la percezione di non essere compreso, oggi fanno riflettere sul bisogno di benessere interiore e di relazioni autentiche. La sua esperienza può diventare un punto di partenza per parlare delle difficoltà che incontrano i giovani e dell'importanza di ascolto e inclusione. Il collegamento è storico e letterario: non attribuisce a Leopardi diagnosi formulate in epoche successive."],
      ["Il diritto alla salute psicologica","L'articolo 32 della Costituzione italiana riconosce la salute come un diritto fondamentale dell'individuo. Questo principio comprende anche la salute psicologica, essenziale per il benessere della persona e per la qualità della sua vita. È importante promuovere la prevenzione, offrire informazioni corrette e garantire a tutti la possibilità di ricevere un sostegno psicologico adeguato. Allo stesso tempo, è necessario superare i pregiudizi e lo stigma che spesso impediscono alle persone di parlare delle proprie difficoltà emotive e di chiedere aiuto. Questa attenzione è particolarmente importante per i giovani, che possono affrontare ansia, stress e insicurezze e devono poter trovare ascolto, comprensione e supporto senza paura di essere giudicati."],
      ["Una scuola che accoglie","L'isolamento sociale, il ritiro prolungato dalle relazioni, il bullismo e il cyberbullismo possono incidere sul benessere e sulla partecipazione alla vita scolastica. Non sono situazioni da liquidare con etichette o battute: servono ascolto, rispetto e collaborazione tra studenti, scuola e adulti di riferimento. Una comunità accogliente previene le esclusioni, interviene davanti alle prepotenze e offre a ciascuno occasioni sicure per sentirsi parte del gruppo."]

      ];
      const place=stops[selectedStop];
      box.innerHTML=`<div class="ls-globe-controls"><p>Trascina per ruotare, pizzica o usa la rotella per lo zoom. Tocca un pallino per seguire l'Islandese.</p></div><div class="ls-earth"><canvas aria-label="Globo interattivo con le tappe del viaggio dell'Islandese"></canvas><span class="ls-earth-hint">Trascina per ruotare · rotella o gesto a due dita per lo zoom · tocca un punto per aprire la tappa</span></div><div class="ls-tabs">${stops.map((s,i)=>`<button class="ls-chip ${selectedStop===i?"active":""}" data-stop="${i}">${i+1}. ${s.name}</button>`).join("")}</div>${place?`<article class="ls-card ls-stop-card"><img class="ls-stop-image" src="https://commons.wikimedia.org/wiki/Special:FilePath/${stops[selectedStop].photo}?width=900" alt="${esc(place.place)}"><div class="ls-stop-copy"><button class="ls-stop-close" data-close-stop aria-label="Chiudi la tappa">×</button><span class="ls-stop-number">TAPPA ${selectedStop+1} DI 5</span><h2 class="ls-stop-name">${esc(place.name)}</h2><p class="ls-stop-place">${esc(place.place)}</p><p class="ls-stop-summary">${esc(place.summary)}</p><p class="ls-photo-credit">Foto: Wikimedia Commons</p></div></article>`:""}`;
      const canvas=box.querySelector("canvas");
      drawGlobe(canvas,stops,selectedStop,index=>{selectedStop=index;renderGame()});
      box.querySelectorAll("[data-stop]").forEach(b=>b.addEventListener("click",()=>{selectedStop=Number(b.dataset.stop);renderGame()}));
      const image=box.querySelector(".ls-stop-image");
      if(image)image.addEventListener("error",()=>{image.removeAttribute("src");image.alt=place.place+" · fotografia non disponibile";image.style.opacity=".15"},{once:true});
    }
  }
  root.addEventListener("click",function(e){
    const t=e.target.closest("button"); if(!t)return;
    if(t.dataset.open!==undefined){eventOpen=eventOpen===Number(t.dataset.open)?-1:Number(t.dataset.open);render()}
    if(t.dataset.eventAnswer!==undefined){const event=timeline[eventOpen];const f=root.querySelector("[data-event-feedback]");f.textContent=Number(t.dataset.eventAnswer)===event[6]?"Esatto! "+event[7]:"Non proprio. "+event[7];}
    if(t.dataset.tab){tab=t.dataset.tab;render();return}
    if(t.dataset.dialogueTab!==undefined){dialogueTab=Number(t.dataset.dialogueTab);render()}
    if(t.hasAttribute("data-speak")){if("speechSynthesis"in window){if(speechReading){speechSynthesis.cancel();speechReading=false;t.textContent="🔊 Leggi la parafrasi";t.setAttribute("aria-pressed","false")}else{const utterance=new SpeechSynthesisUtterance(dialogue.map(d=>d[1]).join(" "));utterance.onend=utterance.onerror=()=>{speechReading=false;const button=root.querySelector("[data-speak]");if(button){button.textContent="🔊 Leggi la parafrasi";button.setAttribute("aria-pressed","false")}};speechReading=true;t.textContent="⏹ Interrompi la lettura";t.setAttribute("aria-pressed","true");speechSynthesis.speak(utterance)}}else alert("La lettura vocale non è disponibile in questo browser.")}
    if(t.dataset.qanswer!==undefined){const i=Number(t.dataset.qanswer);if(qselected===-1){qselected=i;if(i===questions[qi][3])qscore++;renderGame()}}
    if(t.hasAttribute("data-next")){qi++;qselected=-1;renderGame()}
    if(t.hasAttribute("data-restart")){qi=0;qscore=0;qselected=-1;scoreSaved=false;scoreError="";renderGame()}
    if(t.dataset.pick!==undefined){matchSelected=Number(t.dataset.pick);renderGame()}
    if(t.dataset.match!==undefined){const i=Number(t.dataset.match);if(matchSelected>=0){if(matchSelected===i)matched.push(i);else errors++;matchSelected=-1;renderGame()}}
    if(t.hasAttribute("data-match-reset")){matched=[];errors=0;matchSelected=-1;renderGame()}
    if(t.dataset.tf!==undefined){tfAnswer=t.dataset.tf==="true";if(tfAnswer===trueFalse[tfIndex][1])tfScore++;renderGame()}
    if(t.hasAttribute("data-tf-next")){tfIndex++;tfAnswer=null;renderGame()}
    if(t.hasAttribute("data-tf-reset")){tfIndex=0;tfScore=0;tfAnswer=null;renderGame()}
    if(t.dataset.subject!==undefined){subject=Number(t.dataset.subject);render()}
    if(t.dataset.stop!==undefined){selectedStop=Number(t.dataset.stop);renderGame()}
    if(t.hasAttribute("data-close-stop")){selectedStop=-1;renderGame()}
  });
  root.addEventListener("submit",function(e){
    const form=e.target.closest("[data-score-form]"); if(!form)return;
    e.preventDefault();
    const name=new FormData(form).get("name").trim();
    if(!name)return;
    try{
      const saved=JSON.parse(localStorage.getItem(scoreKey)||"[]");
      if(!Array.isArray(saved))throw new Error("I punteggi salvati non sono validi.");
      saved.push({player_name:name.slice(0,30),score:qscore,total:questions.length});
      localStorage.setItem(scoreKey,JSON.stringify(saved));
      scoreSaved=true;scoreError="";
    }catch(error){scoreError=error.message||"Non è stato possibile salvare il punteggio in questo browser."}
    renderGame();
  });
  window.addEventListener("scroll",function(){const r=root.getBoundingClientRect(),h=root.offsetHeight-window.innerHeight;root.querySelector(".ls-progress i").style.width=(h>0?Math.max(0,Math.min(100,(-r.top/h)*100)):0)+"%"},{passive:true});
  root.querySelectorAll(".ls-links button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
  root.querySelector(".ls-brand").addEventListener("click",function(e){e.preventDefault();go("home")});
  render();
})();
</script>
